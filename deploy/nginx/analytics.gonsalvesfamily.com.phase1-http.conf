# Deploy first: HTTP only (ACME webroot + proxy to Gunicorn on 127.0.0.1:5001).
# Install: cp to /etc/nginx/sites-available/analytics.gonsalvesfamily.com, enable, nginx -t, reload.
#
# Then issue a certificate (when Let's Encrypt is reachable):
#   certbot certonly --webroot -w /var/www/certbot -d analytics.gonsalvesfamily.com
#
# Finally replace this file with analytics.gonsalvesfamily.com.https.conf (same path on server).

upstream ligneous_python_api {
    server 127.0.0.1:5001;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name analytics.gonsalvesfamily.com;

    access_log /var/log/nginx/analytics.gonsalvesfamily.com.access.log;
    error_log /var/log/nginx/analytics.gonsalvesfamily.com.error.log;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location / {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_pass http://ligneous_python_api;
    }
}
