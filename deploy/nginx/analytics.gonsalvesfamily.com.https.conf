# After certbot: HTTP → HTTPS redirect + TLS reverse proxy to Gunicorn.
# Replace /etc/nginx/sites-available/analytics.gonsalvesfamily.com with this file, then nginx -t && reload.

upstream ligneous_python_api {
    server 127.0.0.1:5001;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name analytics.gonsalvesfamily.com;

    access_log /var/log/nginx/analytics.gonsalvesfamily.com.access.log;
    error_log /var/log/nginx/analytics.gonsalvesfamily.com.error.log;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # nginx 1.22.x: use http2 on the listen line (not the standalone `http2 on` directive).
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name analytics.gonsalvesfamily.com;

    access_log /var/log/nginx/analytics.gonsalvesfamily.com.ssl.access.log;
    error_log /var/log/nginx/analytics.gonsalvesfamily.com.ssl.error.log;

    ssl_certificate /etc/letsencrypt/live/analytics.gonsalvesfamily.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/analytics.gonsalvesfamily.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 4m;

    location / {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_pass http://ligneous_python_api;
    }
}
